<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campo de girasoles</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#3a2610;--sky:#7cc4f0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--sky);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
header{position:fixed;top:0;left:0;padding:calc(18px + env(safe-area-inset-top,0px)) 22px 0;color:var(--ink);font-family:"Fraunces",Georgia,serif;pointer-events:none}
h1{margin:0;font-size:clamp(26px,5vw,44px);font-weight:600;letter-spacing:-.01em}
p{margin:6px 0 0;font-size:15px;max-width:26ch;line-height:1.35;opacity:.85}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap">
</head>
<body>
<canvas id="c" role="img" aria-label="Un campo de girasoles que giran hacia el cursor"></canvas>
<header><h3>Para la mejor capi</h3></header>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,hz,flowers=[],mx,my,tx,ty,sunX,sunY;

// Generador de números "aleatorios" con semilla fija (el campo siempre se ve igual)
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// Crea las filas de girasoles (lejos = pequeños, cerca = grandes)
function build(){
  const d=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  hz=H*0.48;sunX=W*0.78;sunY=H*0.17;
  if(mx===undefined){mx=tx=sunX;my=ty=sunY}
  const r=rng(7),rows=10;flowers=[];
  for(let i=0;i<rows;i++){
    const t=i/(rows-1),s=0.22+1.3*t,y=hz+(H-hz)*(0.06+0.95*Math.pow(t,1.3)),sp=88*s;
    for(let x=-sp;x<W+sp;x+=sp){
      flowers.push({x:x+(r()-.5)*sp*.8,y:y+(r()-.5)*sp*.3,s:s*(0.9+r()*.2),t:t,ph:r()*6.28,v:r()});
    }
  }
}

// Dibuja el fondo y luego todos los girasoles
function draw(time){
  let g=ctx.createLinearGradient(0,0,0,hz);
  g.addColorStop(0,'#6fb9ee');g.addColorStop(1,'#fdeeb8');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,hz+2);
  g=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,H*0.32);
  g.addColorStop(0,'rgba(255,250,210,.95)');g.addColorStop(.25,'rgba(255,240,170,.5)');g.addColorStop(1,'rgba(255,240,170,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,hz);
  ctx.fillStyle='#fff8d8';ctx.beginPath();ctx.arc(sunX,sunY,Math.min(W,H)*0.045,0,6.283);ctx.fill();
  ctx.fillStyle='#a9c47a';ctx.beginPath();ctx.moveTo(0,hz);
  for(let x=0;x<=W;x+=20)ctx.lineTo(x,hz-14-Math.sin(x*0.006)*10-Math.sin(x*0.017)*5);
  ctx.lineTo(W,hz+2);ctx.closePath();ctx.fill();
  g=ctx.createLinearGradient(0,hz,0,H);
  g.addColorStop(0,'#a3bf52');g.addColorStop(1,'#3e6a1f');
  ctx.fillStyle=g;ctx.fillRect(0,hz,W,H-hz);
  mx+=(tx-mx)*0.07;my+=(ty-my)*0.07;   // suaviza el movimiento hacia el cursor
  for(const f of flowers)flower(f,time);
  if(!still)requestAnimationFrame(draw);
}

// Dibuja un girasoles: tallo, hojas, pétalos y centro
function flower(f,time){
  const R=34*f.s,sh=175*f.s,bx=f.x,by=f.y;
  const sw=still?0:Math.sin(time*0.0011+f.ph)*R*0.3+Math.sin(time*0.0004+f.x*0.004)*R*0.25;
  const hx=bx+sw,hy=by-sh;

  // Tallo
  ctx.strokeStyle='hsl(98,42%,'+(46-f.t*16)+'%)';ctx.lineWidth=Math.max(1.5,5*f.s);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(bx,by);ctx.quadraticCurveTo(bx+sw*0.1,by-sh*0.5,hx,hy+R*0.3);ctx.stroke();

  // Hojas (solo en las flores medianas y grandes)
  if(f.s>0.45){
    ctx.fillStyle='hsl(105,45%,'+(38-f.t*10)+'%)';
    for(const L of [[-1,.35],[1,.55]]){
      ctx.beginPath();ctx.ellipse(bx+sw*0.15*L[1]+L[0]*R*0.7,by-sh*L[1],R*0.7,R*0.22,L[0]*-0.5,0,6.283);ctx.fill();
    }
  }

  // Hacia dónde mira la flor (dirección del cursor)
  const dx=mx-hx,dy=my-hy,d=Math.hypot(dx,dy)||1,k=Math.min(1,d/(W*0.4)),lx=dx/d*k,ly=dy/d*k*0.6;

  ctx.save();ctx.translate(hx,hy);

  // Pétalos: dos capas de 14
  for(let layer=0;layer<2;layer++){
    ctx.fillStyle=layer?'#ffcf2e':'#e9a80e';
    for(let i=0;i<14;i++){
      ctx.save();ctx.rotate(i/14*6.283+layer*0.22+f.ph);
      ctx.beginPath();ctx.ellipse(R*(layer?0.8:0.78),0,R*0.38,R*(layer?0.16:0.18),0,0,6.283);ctx.fill();ctx.restore();
    }
  }

  // Centro café, desplazado hacia el cursor
  const cx=lx*R*0.13,cy=ly*R*0.13,dr=R*0.5;
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,dr);
  g.addColorStop(0,'#2a1508');g.addColorStop(1,'#6b3f17');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,dr,0,6.283);ctx.fill();

  // Semillas en espiral (solo en flores grandes)
  if(R>12){
    ctx.fillStyle='#b0712d';
    for(let i=1;i<40;i++){
      const rr=dr*0.92*Math.sqrt(i/40),a=i*2.39996;
      ctx.beginPath();ctx.arc(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,R*0.035,0,6.283);ctx.fill();
    }
  }
  ctx.restore();
}

// Eventos: mouse, dedo y cambio de tamaño de ventana
addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY;if(still)draw(0)});
addEventListener('pointerdown',e=>{tx=e.clientX;ty=e.clientY});
addEventListener('resize',()=>{build();if(still)draw(0)});
build();requestAnimationFrame(draw);
</script>
</body>
</html>
