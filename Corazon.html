<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heart Particles</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="pinkboard"></canvas>
  <script>
    const settings = {
      particles: {
        length: 500,
        duration: 2,
        velocity: 100,
        effect: -0.75,
        size: 8
      }
    };

    let Point = function(x = 0, y = 0) {
      this.x = x;
      this.y = y;
    };

    Point.prototype.clone = function () {
      return new Point(this.x, this.y);
    };

    Point.prototype.length = function(length) {
      if (length === undefined)
        return Math.sqrt(this.x * this.x + this.y * this.y);
      this.normalize();
      this.x *= length;
      this.y *= length;
      return this;
    };

    Point.prototype.normalize = function() {
      const length = this.length();
      this.x /= length;
      this.y /= length;
      return this;
    };

    const Particle = function() {
      this.position = new Point();
      this.velocity = new Point();
      this.acceleration = new Point();
      this.age = 0;
    };

    Particle.prototype.initialize = function(x, y, dx, dy) {
      this.position.x = x;
      this.position.y = y;
      this.velocity.x = dx;
      this.velocity.y = dy;
      this.acceleration.x = dx * settings.particles.effect;
      this.acceleration.y = dy * settings.particles.effect;
      this.age = 0;
    };

    Particle.prototype.update = function(deltaTime) {
      this.position.x += this.velocity.x * deltaTime;
      this.position.y += this.velocity.y * deltaTime;
      this.velocity.x += this.acceleration.x * deltaTime;
      this.velocity.y += this.acceleration.y * deltaTime;
      this.age += deltaTime;
    };

    Particle.prototype.draw = function(context, image) {
      const ease = t => (--t) * t * t + 1;
      const size = image.width * ease(this.age / settings.particles.duration);
      context.globalAlpha = 1 - this.age / settings.particles.duration;
      context.drawImage(
        image,
        this.position.x - size / 2,
        this.position.y - size / 2,
        size,
        size
      );
    };

    const ParticlePool = function(length) {
      this.particles = new Array(length);
      for (let i = 0; i < length; i++) {
        this.particles[i] = new Particle();
      }
      this.firstActive = 0;
      this.firstFree = 0;
      this.duration = settings.particles.duration;
    };

    ParticlePool.prototype.add = function(x, y, dx, dy) {
      this.particles[this.firstFree].initialize(x, y, dx, dy);
      this.firstFree++;
      if (this.firstFree === this.particles.length) this.firstFree = 0;
      if (this.firstActive === this.firstFree) {
        this.firstActive++;
        if (this.firstActive === this.particles.length) this.firstActive = 0;
      }
    };

    ParticlePool.prototype.update = function(deltaTime) {
      let i = this.firstActive;
      while (i !== this.firstFree) {
        const particle = this.particles[i];
        particle.update(deltaTime);
        if (particle.age >= this.duration) {
          this.firstActive++;
          if (this.firstActive === this.particles.length) this.firstActive = 0;
        } else {
          i++;
          if (i === this.particles.length) i = 0;
        }
      }
    };

    ParticlePool.prototype.draw = function(context, image) {
      let i = this.firstActive;
      while (i !== this.firstFree) {
        this.particles[i].draw(context, image);
        i++;
        if (i === this.particles.length) i = 0;
      }
    };

    const canvas = document.getElementById("pinkboard");
    const context = canvas.getContext("2d");

    const pool = new ParticlePool(settings.particles.length);
    const particleRate = settings.particles.length / settings.particles.duration;
    let time;

    function PointOnHeart(t) {
      return new Point(
        160 * Math.pow(Math.sin(t), 3),
        130 * Math.cos(t) -
          50 * Math.cos(2 * t) -
          20 * Math.cos(3 * t) -
          10 * Math.cos(4 * t)
      );
    }

    function createHeartImage() {
      const size = settings.particles.size;
      const canvas2 = document.createElement("canvas");
      const ctx = canvas2.getContext("2d");
      canvas2.width = size;
      canvas2.height = size;

      ctx.beginPath();
      ctx.moveTo(size / 2, size / 4);
      ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, size / 2);
      ctx.bezierCurveTo(0, size, size / 2, size, size / 2, size * 0.75);
      ctx.bezierCurveTo(size / 2, size, size, size, size, size / 2);
      ctx.bezierCurveTo(size, 0, size / 2, 0, size / 2, size / 4);
      ctx.closePath();

      ctx.fillStyle = "#ff2a68";
      ctx.fill();

      const image = new Image();
      image.src = canvas2.toDataURL();
      return image;
    }

    const image = createHeartImage();

    function render() {
      requestAnimationFrame(render);

      const newTime = Date.now() / 1000;
      const deltaTime = newTime - (time || newTime);
      time = newTime;

      context.clearRect(0, 0, canvas.width, canvas.height);

      const amount = particleRate * deltaTime;
      for (let i = 0; i < amount; i++) {
        const pos = PointOnHeart(Math.PI - 2 * Math.PI * Math.random());
        const dir = pos.clone().normalize().length(settings.particles.velocity);
        pool.add(
          canvas.width / 2 + pos.x,
          canvas.height / 2 - pos.y,
          dir.x,
          -dir.y
        );
      }

      pool.update(deltaTime);
      pool.draw(context, image);
    }

    function onResize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.onresize = onResize;

    setTimeout(() => {
      onResize();
      render();
    }, 10);
  </script>
</body>
</html>
